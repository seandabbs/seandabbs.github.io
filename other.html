<script>
function darkModeLightMode() {
    
  let html = document.querySelector('html');
  switch (true){
    case (!html.classList.contains('theme-dark') && !html.classList.contains('theme-light')):
      if (window.matchMedia) 
        if(window.matchMedia('(prefers-color-scheme: dark)').matches){
          html.className = 'theme-light';
          break;
        }
      html.className = 'theme-dark';
      break;
    case html.classList.contains('theme-dark'):
      html.className = 'theme-light';
      break;
    case html.classList.contains('theme-light'):
      html.className = 'theme-dark';
      break;
    
  }
  
}
</script>
